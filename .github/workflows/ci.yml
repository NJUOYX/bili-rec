name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # B-class detector (#19 方案 5): public classes/methods in src must have
      # a runtime caller in src. Whitelist: scripts/zero_callers_whitelist.txt
      - run: uv run python scripts/zero_callers.py
      - run: uv run pytest -m "unit or component" --cov=birec --cov-report=xml --cov-fail-under=80
