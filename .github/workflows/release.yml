name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # hatchling reads the version from src/birec/__init__.py, never from
      # the git tag — a tag bump alone ships artifacts under the old name.
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG#v}"
          pkg=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/birec/__init__.py)
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $TAG but package version is $pkg — bump src/birec/__init__.py first"
            exit 1
          fi

      # The wheel has to carry the web UI: without it `pip install birec`
      # silently serves an API with no interface, because the app mounts the
      # frontend only when it finds one.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - name: Build the frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Stage the frontend into the package
        run: |
          rm -rf src/birec/web/static
          cp -r frontend/dist src/birec/web/static

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Verify the wheel ships the UI
        run: |
          wheel=$(ls dist/*.whl)
          if ! unzip -l "$wheel" | grep -q 'birec/web/static/index.html'; then
            echo "::error::$wheel carries no frontend; the release would ship without a UI"
            exit 1
          fi
          echo "$wheel ships the UI"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # An OCI repository name has to be lowercase, and github.repository
          # carries the owner exactly as written. Pushing "ghcr.io/Owner/name"
          # fails outright, and nothing before the first real tag would have
          # caught it: the CI docker job builds without pushing.
          repo=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')
          tags="ghcr.io/${repo}:${REF_NAME}"
          # A pre-release must not become what `docker pull` gets by default,
          # nor be presented as the current version on the releases page.
          case "$REF_NAME" in
            *-*) prerelease=true ;;
            *)   prerelease=false; tags="${tags},ghcr.io/${repo}:latest" ;;
          esac
          {
            echo "tags=${tags}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - uses: softprops/action-gh-release@v2
        with:
          # Named rather than globbed: uv drops a .gitignore into dist/, and
          # "dist/*" uploaded it as an asset called default.gitignore.
          files: |
            dist/*.whl
            dist/*.tar.gz
          prerelease: ${{ steps.meta.outputs.prerelease }}
          # Otherwise the release body is empty, which for a first release is
          # the only thing a visitor has to go on.
          generate_release_notes: true

  # Pull what was just pushed and record against it (#19 方案 4): the only
  # place the push:true path is exercised — image name, manifest, and the
  # artifact itself. PR smoke tests a locally built image; this one tests
  # the release.
  smoke:
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute the published image name
        id: image
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          repo=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repo}:${REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker pull "$IMAGE"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev

      - name: Build fake-bili on top of the published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker build -f tests/smoke_e2e/Dockerfile.fake-bili \
            -t fake-bili:ci --build-arg BASE_IMAGE="$IMAGE" .

      - name: Run publish-artifact smoke against the release
        env:
          BIREC_IMAGE: ${{ steps.image.outputs.name }}
        run: uv run pytest tests/smoke_e2e -m smoke -v --basetemp .smoke-tmp

      - name: Upload smoke evidence (logs + recordings) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-evidence
          path: .smoke-tmp
          if-no-files-found: ignore
