[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "birec"
dynamic = ["version"]
description = "bili-rec: a local recorder for Bilibili live streams"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "bili-rec" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "reactivex>=4",
    "aiohttp>=3",
    "lxml",
    "brotli",
    "typer",
    "loguru",
    "tenacity",
    "tqdm",
    "tomli-w",
    "lxml-html-clean>=0.4.5",
]

[project.scripts]
birec = "birec.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "aioresponses",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.hatch.version]
path = "src/birec/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/birec"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tqdm.*", "brotli", "dmconvert.*", "aioresponses.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: developer unit tests",
    "component: developer component/pipeline tests",
    "system: system/end-to-end tests",
    "ffmpeg: tests that require a real ffmpeg binary",
    "slow: slow-running tests",
]

[tool.coverage.run]
source = ["birec"]
branch = true

[tool.coverage.report]
show_missing = true
