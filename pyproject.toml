[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "birec"
dynamic = ["version"]
description = "bili-rec: a local recorder for Bilibili live streams"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "bili-rec" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "reactivex>=4",
    "aiohttp>=3",
    "lxml",
    "brotli",
    "typer",
    "loguru",
    "tenacity",
    "tqdm",
    "tomli-w",
    "lxml-html-clean>=0.4.5",
    "dmconvert>=0.0.4",
]

[project.scripts]
birec = "birec.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "aioresponses",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.hatch.version]
path = "src/birec/__init__.py"

# Declared for every target, not just the wheel. ``uv build`` builds the sdist
# first and then the wheel *from that sdist*, so an artifact the sdist drops is
# missing from the wheel too — which is exactly how a release pipeline that
# looked correct produced a wheel with no UI in it.
[tool.hatch.build]
artifacts = ["src/birec/web/static/**"]
# The frontend is a separate toolchain with its own lockfile and its own
# .gitignore, and hatchling only reads the root one — so node_modules lands in
# the sdist and takes it from under a megabyte to 33 MB. What a source build
# needs from the frontend is the built UI, and that arrives via ``artifacts``.
exclude = ["/frontend"]

[tool.hatch.build.targets.wheel]
packages = ["src/birec"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tqdm.*", "brotli", "dmconvert.*", "aioresponses.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: developer unit tests",
    "component: developer component/pipeline tests",
    "system: system/end-to-end tests",
    "realbili: real Bilibili live-room verification (network, opt-in via BIREC_REALBILI=1)",
    "ffmpeg: tests that require a real ffmpeg binary",
    "slow: slow-running tests",
]

[tool.coverage.run]
source = ["birec"]
branch = true

[tool.coverage.report]
show_missing = true

# ── Mutation testing (方案 3 of #19) ─────────────────────────────────────────
# Scoped deliberately: mutation testing runs the covering tests once per mutant,
# so it is aimed at the modules where the escaped bugs actually lived rather
# than at the whole tree.
[tool.mutmut]
# The whole package is copied so imports resolve inside mutants/, while
# only_mutate keeps the actual mutation surface small.
source_paths = ["src/birec"]
only_mutate = [
    # The modules the escaped bugs actually lived in: status reporting, the
    # download loop, the live-state machine, and FLV parsing.
    "src/birec/core/statistics.py",
    "src/birec/core/recorder.py",
    "src/birec/core/flv_stream_recorder_impl.py",
    "src/birec/bili/live_monitor.py",
    "src/birec/flv/operators/parse.py",
    "src/birec/task/__init__.py",
]
pytest_add_cli_args_test_selection = ["tests/unit/"]
# mutmut runs pytest with plugin autoloading off, which would drop
# pytest-asyncio and leave every async test unrun (and every mutant "surviving").
pytest_add_cli_args = ["-p", "pytest_asyncio"]
